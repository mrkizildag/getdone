name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # @raycast/api's postinstall runs bin/ray, which ships an arm64 macOS binary
  # only and fails on a Linux runner. Nothing in the checks below needs it:
  # tsc, eslint, prettier and vitest all run from plain node_modules.
  NPM_INSTALL: npm ci --ignore-scripts

jobs:
  quality:
    name: Types, lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: $NPM_INSTALL

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks diffs the history, so a shallow clone would hide most of it.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: $NPM_INSTALL

      - name: Audit dependencies
        # Raised from `critical` once the inherited advisories were cleared:
        # four by a non-breaking `npm audit fix`, and lodash by dropping the
        # dependency outright. Nothing high-severity should reappear unnoticed.
        run: npm audit --audit-level=high

      - name: Full audit report (informational)
        if: always()
        run: npm audit || true

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
