name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Advisories land after a PR merges, so re-scan main weekly.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Nothing needs compiling: CodeQL reads the TypeScript directly, and
          # the Raycast build only runs on a machine with Raycast installed.
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
